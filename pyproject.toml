[project]
name = "haus-panel-dev"
version = "0.1.0"
requires-python = ">=3.11"
description = "Entwicklungsumgebung für die Home-Assistant-App Haus Eichner Panel"

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["haus_panel/app", "tests"]
extend-exclude = ["haus_panel/app/panelstudio/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PT", "C4"]
ignore = ["S101", "S311", "ASYNC109", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT018", "E501"]
"tools/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["haus_panel/app", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
